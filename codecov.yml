coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%

ignore:
  - "cmd/**/main.go"      # entry wrappers, no testable logic
  - "scripts/**"          # one-shot release tooling (sign.go)
  - "**/*_gen.go"         # generated code
