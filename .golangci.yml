version: "2"

run:
  # Maximum time allowed for golangci-lint execution
  timeout: 5m

  # Run linters on test files as well
  tests: true

  # Directories that should be skipped entirely
  skip-dirs:
    - vendor
    - .git

  # Files that should be ignored
  skip-files:
    - ".*_gen.go"

linters:
  enable:
    # ---------------------------------------------------------------------
    # Core correctness, bugs, and security
    # ---------------------------------------------------------------------
    - govet                # Standard Go static analysis (compiler-level checks)
    - staticcheck          # Advanced static analysis (bugs, correctness, performance)
    - gosec                # Security vulnerability detection
    - errcheck             # Ensure errors are properly handled
    - ineffassign          # Detect ineffectual assignments
    - nilerr               # Catch incorrect nil error handling
    - nilnil               # Prevent returning (nil, nil)
    - errorlint            # Correct error comparisons and wrapping
    - bodyclose            # Ensure HTTP response bodies are closed
    - sqlclosecheck        # Ensure SQL rows/statements are closed
    - rowserrcheck         # Ensure Rows.Err() is checked
    - unconvert            # Remove unnecessary type conversions
    - unused               # Detect unused code
    - unparam              # Detect unused function parameters

    # ---------------------------------------------------------------------
    # Code quality and maintainability
    # ---------------------------------------------------------------------
    - revive                # Configurable style and correctness rules
    - gocritic              # Opinionated code quality checks
    - gocognit              # Cognitive complexity checks
    - cyclop                # Cyclomatic complexity per function
    - gocyclo               # Alternative cyclomatic complexity checker
    - funlen                # Detect overly long functions
    - nestif                # Detect deeply nested if statements
    - dupl                  # Detect duplicated code
    - goconst               # Suggest constants instead of repeated literals
    - prealloc              # Suggest slice preallocation for performance
    - wastedassign          # Detect overwritten but unused assignments
    - makezero              # Detect non-zero length slice initialization

    # ---------------------------------------------------------------------
    # Style, consistency, and readability
    # ---------------------------------------------------------------------
    - whitespace            # Detect unnecessary whitespace
    - godot                 # Enforce punctuation in comments
    - errname               # Enforce error naming conventions
    - nakedret              # Avoid naked returns in long functions
    - nonamedreturns        # Discourage named returns
    - predeclared           # Prevent shadowing predeclared identifiers
    - asciicheck            # Disallow non-ASCII identifiers
    - bidichk               # Detect suspicious Unicode bidi characters
    - nolintlint            # Validate //nolint directives

    # ---------------------------------------------------------------------
    # Context, concurrency, and correctness patterns
    # ---------------------------------------------------------------------
    - noctx                 # Ensure context.Context is used in external calls
    - fatcontext            # Prevent context reuse in loops
    - recvcheck             # Ensure consistent receiver usage
    - copyloopvar           # Prevent loop variable capture bugs
    - embeddedstructfieldcheck # Forbid embedding mutexes anonymously

    # ---------------------------------------------------------------------
    # Imports, modules, and dependencies
    # ---------------------------------------------------------------------
    - depguard              # Restrict forbidden imports
    - gomoddirectives       # Validate go.mod directives

    # ---------------------------------------------------------------------
    # HTTP, logging, and performance
    # ---------------------------------------------------------------------
    - canonicalheader       # Enforce canonical HTTP headers
    - loggercheck           # Validate structured logging usage
    - sloglint              # Enforce log/slog best practices
    - nosprintfhostport     # Avoid fmt.Sprintf for host:port
    - perfsprint            # Detect inefficient fmt.Sprintf usage

    # ---------------------------------------------------------------------
    # Testing best practices
    # ---------------------------------------------------------------------
    - tparallel              # Correct usage of t.Parallel
    - testpackage            # Prefer external test packages
    - testifylint            # Correct usage of testify assertions

formatters:
  enable:
    - goimports             # Format code and manage imports
    - golines               # Wrap long lines

settings:
  cyclop:
    # Maximum allowed cyclomatic complexity per function
    max-complexity: 20
    # Average complexity allowed per package
    package-average: 10.0

  gocyclo:
    # Report functions with complexity >= this value
    min-complexity: 20

  gocognit:
    # Report functions with cognitive complexity >= this value
    min-complexity: 20

  funlen:
    # Maximum number of lines per function
    lines: 120
    # Maximum number of statements per function
    statements: 60

  revive:
    # Selected revive rules for production-grade Go code
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: early-return
      - name: error-return
      - name: errorf
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: indent-error-flow
      - name: range
      - name: receiver-naming
      - name: superfluous-else
      - name: var-naming
      - name: unexported-return
      - name: unnecessary-stmt
      - name: useless-break

  errcheck:
    # Check ignored type assertions
    check-type-assertions: true
    # Check assignments to blank identifier
    check-blank: true

  errorlint:
    asserts: true
    comparison: true

  depguard:
    rules:
      - name: "block-deprecated-and-unsafe"
        files:
          - "$all"
        deny:
          - pkg: github.com/golang/protobuf
            desc: "Deprecated, use google.golang.org/protobuf"
          - pkg: github.com/satori/go.uuid
            desc: "Unmaintained, use github.com/google/uuid"
          - pkg: io/ioutil
            desc: "Deprecated since Go 1.16"
          - pkg: golang.org/x/net/context
            desc: "Use context from stdlib"

  embeddedstructfieldcheck:
    # Forbid embedding sync.Mutex or sync.RWMutex anonymously
    forbid-mutex: true

  nakedret:
    # Allow naked returns only in short functions
    max-func-lines: 60

  gosec:
    # Report only high severity and high confidence issues
    severity: high
    confidence: high

  staticcheck:
    checks:
      - all
      # Do not require package comments
      - -ST1000
      # Allow flexible receiver naming
      - -ST1016
      # Do not enforce suggested struct field access rewrites
      - -QF1008

  golines:
    # Maximum line length before wrapping
    max-len: 120

  goimports:
    # Local import prefix for proper grouping
    local-prefixes:
      - github.com/Jaro-c/Lynx

issues:
  # Do not artificially limit reported issues
  max-issues-per-linter: 0
  max-same-issues: 0

  # Use default exclusions in addition to custom ones
  exclude-use-default: false

  exclude-rules:
    # Relax complexity rules for test files
    - path: _test\.go
      linters:
        - gocognit
        - cyclop
        - gocyclo
        - funlen

    # Allow controlled usage of math/rand where justified
    - linters:
        - gosec
      text: "G404"

    # Ignore unchecked Close() in well-known safe cases
    - linters:
        - errcheck
      text: "Close"
