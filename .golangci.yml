version: "2"

run:
  # Maximum time allowed for golangci-lint execution
  timeout: 10m

  # Run linters on test files as well
  tests: true

linters:
  enable:
    # ---------------------------------------------------------------------
    # Core correctness, bugs, and security
    # ---------------------------------------------------------------------
    - govet
    - staticcheck
    - gosec
    - errcheck
    - ineffassign
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - unconvert

    # ---------------------------------------------------------------------
    # Maintainability and complexity
    # ---------------------------------------------------------------------
    - revive
    - gocritic
    - gocyclo
    - funlen
    - nestif
    - prealloc
    - wastedassign
    - makezero

    # ---------------------------------------------------------------------
    # Style and consistency
    # ---------------------------------------------------------------------
    - whitespace
    - godot
    - errname
    - nakedret
    - nonamedreturns
    - predeclared
    - asciicheck
    - bidichk
    - nolintlint

    # ---------------------------------------------------------------------
    # Context / concurrency patterns
    # ---------------------------------------------------------------------
    - noctx
    - fatcontext
    - recvcheck
    - copyloopvar

    # ---------------------------------------------------------------------
    # Imports / dependencies
    # ---------------------------------------------------------------------
    # - depguard
    - gomoddirectives

    # ---------------------------------------------------------------------
    # Logging / HTTP / perf details
    # ---------------------------------------------------------------------
    - canonicalheader
    - loggercheck
    - sloglint
    - nosprintfhostport
    - perfsprint

    # ---------------------------------------------------------------------
    # Testing best practices
    # ---------------------------------------------------------------------
    - tparallel
    - testifylint

  settings:
    # ---------------------------------------------------------------------
    # Make "main" functions and CLI rendering functions realistic
    # ---------------------------------------------------------------------
    funlen:
      # Maximum number of lines per function
      lines: 150
      # Maximum number of statements per function
      statements: 110

    gocyclo:
      # Report functions with complexity >= this value.
      # Raised to 70 to accommodate the IPC RegisterHandlers dispatcher
      # (68) and validateSpec (43) — these are naturally branchy by
      # design. New code with lower complexity still gets checked.
      min-complexity: 70

    nestif:
      # Allow deeper nesting in transport/installer paths where
      # error-recovery chains are intrinsically nested.
      min-complexity: 12

    embeddedstructfieldcheck:
      # Forbid embedding sync.Mutex or sync.RWMutex anonymously
      forbid-mutex: true

    errcheck:
      # Check ignored type assertions.
      # check-blank intentionally false: explicit _ discards are an accepted
      # pattern for best-effort operations (audit log writes, kill signals, etc.)
      check-type-assertions: true
      check-blank: false

    errorlint:
      asserts: true
      comparison: true

    gosec:
      # Report only high severity and high confidence issues
      severity: high
      confidence: high

    staticcheck:
      checks:
        - all
        # Do not require package comments
        - -ST1000
        # Allow flexible receiver naming
        - -ST1016
        # Do not enforce suggested struct field access rewrites
        - -QF1008

    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    # ---------------------------------------------------------------------
    # depguard: use "lax" mode (allow everything unless explicitly denied)
    # and explicitly ALLOW your own module + go-winio.
    # This prevents the default "Main" strict list from breaking your repo.
    # ---------------------------------------------------------------------
    depguard:
      rules:
        main:
          # Allow unless explicitly denied
          list-mode: lax
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/Jaro-c/Lynx
            - github.com/Microsoft/go-winio
          deny:
            - pkg: io/ioutil
              desc: "Deprecated since Go 1.16"
            - pkg: golang.org/x/net/context
              desc: "Use context from stdlib"
            - pkg: github.com/golang/protobuf
              desc: "Deprecated, use google.golang.org/protobuf"
            - pkg: github.com/satori/go.uuid
              desc: "Unmaintained, use github.com/google/uuid"

        tests:
          # Same approach for tests (your internal packages are valid)
          list-mode: lax
          files:
            - $test
          allow:
            - $gostd
            - github.com/Jaro-c/Lynx
            - github.com/stretchr/testify

  exclusions:
    # Keep default exclusions enabled (recommended)
    presets:
      - std-error-handling
      - common-false-positives

    # Skip noise directories and generated files
    paths:
      - vendor
      - \.git
      - .*_gen\.go

    rules:
      # Relax heavy complexity checks on tests
      - path: _test\.go
        linters:
          - gocognit
          - cyclop
          - gocyclo
          - funlen

      # Allow controlled usage of math/rand where justified
      - linters:
          - gosec
        text: "G404"

      # Ignore unchecked Close() in well-known safe cases
      - linters:
          - errcheck
        text: "Close"

      # noctx: test files legitimately use exec.Command / net.Dial without
      # context — adding context to test helpers adds noise with no benefit.
      - path: _test\.go
        linters:
          - noctx

      # gosec G702/G703: taint-analysis false positives on CLI arg and path
      # handling — the inputs are validated or come from trusted sources.
      - linters:
          - gosec
        text: "G702|G703"

      # staticcheck QF1006: lifting loop conditions is a style preference,
      # not a correctness issue.
      - linters:
          - staticcheck
        text: "QF1006"

formatters:
  enable:
    - goimports
    - golines

  settings:
    goimports:
      # Local import prefix for proper grouping
      local-prefixes:
        - github.com/Jaro-c/Lynx

    golines:
      # Maximum line length before wrapping
      max-len: 120
