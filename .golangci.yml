version: "2"

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - .git
  skip-files:
    - ".*_gen.go"

linters:
  enable:
    # Errores, bugs y seguridad
    - govet
    - staticcheck
    - gosec
    - errcheck
    - ineffassign
    - nilerr
    - nilnil
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - unconvert
    - unused
    - unparam

    # Calidad de código y mantenibilidad
    - revive
    - gocritic
    - gocognit
    - cyclop
    - gocyclo
    - funlen
    - nestif
    - dupl
    - goconst
    - prealloc
    - wastedassign
    - makezero

    # Estilo y consistencia
    - whitespace
    - godot
    - errname
    - nakedret
    - nonamedreturns
    - predeclared
    - asciicheck
    - bidichk
    - nolintlint

    # APIs, contexto y concurrencia
    - noctx
    - fatcontext
    - recvcheck
    - copyloopvar
    - embeddedstructfieldcheck

    # Imports y dependencias
    - depguard
    - gomoddirectives

    # HTTP, logging y formatos
    - canonicalheader
    - loggercheck
    - sloglint
    - nosprintfhostport
    - perfsprint

    # Tests
    - tparallel
    - testpackage
    - testifylint

formatters:
  enable:
    - goimports
    - golines

settings:
  cyclop:
    max-complexity: 20
    package-average: 10.0

  gocyclo:
    min-complexity: 20

  gocognit:
    min-complexity: 20

  funlen:
    lines: 120
    statements: 60

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: early-return
      - name: error-return
      - name: errorf
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: indent-error-flow
      - name: range
      - name: receiver-naming
      - name: superfluous-else
      - name: var-naming
      - name: unexported-return
      - name: unnecessary-stmt
      - name: useless-break

  errcheck:
    check-type-assertions: true
    check-blank: true

  errorlint:
    asserts: true
    comparison: true

  depguard:
    rules:
      - name: "block-deprecated-and-unsafe"
        files:
          - "$all"
        deny:
          - pkg: github.com/golang/protobuf
            desc: "Use google.golang.org/protobuf"
          - pkg: github.com/satori/go.uuid
            desc: "Use github.com/google/uuid"
          - pkg: io/ioutil
            desc: "Deprecated since Go 1.16"
          - pkg: golang.org/x/net/context
            desc: "Use context"

  embeddedstructfieldcheck:
    forbid-mutex: true

  nakedret:
    max-func-lines: 60

  gosec:
    severity: high
    confidence: high

  staticcheck:
    checks:
      - all
      - -ST1000
      - -ST1016
      - -QF1008

  golines:
    max-len: 120

  goimports:
    local-prefixes:
      - github.com/Jaro-c/Lynx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-use-default: false

  exclude-rules:
    - path: _test\.go
      linters:
        - gocognit
        - cyclop
        - gocyclo
        - funlen

    - linters:
        - gosec
      text: "G404" # crypto/rand vs math/rand en contextos controlados

    - linters:
        - errcheck
      text: "Close"
