version: "2"

run:
  # Maximum time allowed for golangci-lint execution
  timeout: 5m

  # Run linters on test files as well
  tests: true

  # Skip common noise directories
  skip-dirs:
    - vendor
    - .git

  # Ignore generated files by pattern
  skip-files:
    - ".*_gen.go"

linters:
  enable:
    # ---------------------------------------------------------------------
    # Core correctness, bugs, and security
    # ---------------------------------------------------------------------
    - govet
    - staticcheck
    - gosec
    - errcheck
    - ineffassign
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - unconvert
    - unused
    - unparam

    # ---------------------------------------------------------------------
    # Maintainability and complexity
    # ---------------------------------------------------------------------
    - revive
    - gocritic
    - gocognit
    - cyclop
    - gocyclo
    - funlen
    - nestif
    - dupl
    - goconst
    - prealloc
    - wastedassign
    - makezero

    # ---------------------------------------------------------------------
    # Style and consistency
    # ---------------------------------------------------------------------
    - whitespace
    - godot
    - errname
    - nakedret
    - nonamedreturns
    - predeclared
    - asciicheck
    - bidichk
    - nolintlint

    # ---------------------------------------------------------------------
    # Context / concurrency patterns
    # ---------------------------------------------------------------------
    - noctx
    - fatcontext
    - recvcheck
    - copyloopvar
    - embeddedstructfieldcheck

    # ---------------------------------------------------------------------
    # Imports / dependencies
    # ---------------------------------------------------------------------
    - depguard
    - gomoddirectives

    # ---------------------------------------------------------------------
    # Logging / HTTP / perf details
    # ---------------------------------------------------------------------
    - canonicalheader
    - loggercheck
    - sloglint
    - nosprintfhostport
    - perfsprint

    # ---------------------------------------------------------------------
    # Testing best practices
    # ---------------------------------------------------------------------
    - tparallel
    - testpackage
    - testifylint

  settings:
    # ---------------------------------------------------------------------
    # Make "main" functions and CLI rendering functions realistic
    # ---------------------------------------------------------------------
    funlen:
      # Maximum number of lines per function
      lines: 120
      # Maximum number of statements per function
      statements: 80

    cyclop:
      # Maximum allowed cyclomatic complexity per function
      max-complexity: 20
      # Average complexity allowed per package
      package-average: 10.0

    gocyclo:
      # Report functions with complexity >= this value
      min-complexity: 20

    gocognit:
      # Report functions with cognitive complexity >= this value
      min-complexity: 20

    embeddedstructfieldcheck:
      # Forbid embedding sync.Mutex or sync.RWMutex anonymously
      forbid-mutex: true

    errcheck:
      # Check ignored type assertions and blank identifier assignments
      check-type-assertions: true
      check-blank: true

    errorlint:
      asserts: true
      comparison: true

    gosec:
      # Report only high severity and high confidence issues
      severity: high
      confidence: high

    staticcheck:
      checks:
        - all
        # Do not require package comments
        - -ST1000
        # Allow flexible receiver naming
        - -ST1016
        # Do not enforce suggested struct field access rewrites
        - -QF1008

    goimports:
      # Local import prefix for proper grouping
      local-prefixes:
        - github.com/Jaro-c/Lynx

    golines:
      # Maximum line length before wrapping
      max-len: 120

    # ---------------------------------------------------------------------
    # depguard: use "lax" mode (allow everything unless explicitly denied)
    # and explicitly ALLOW your own module + go-winio.
    # This prevents the default "Main" strict list from breaking your repo.
    # ---------------------------------------------------------------------
    depguard:
      rules:
        main:
          # Allow unless explicitly denied
          list-mode: lax
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/Jaro-c/Lynx
            - github.com/Microsoft/go-winio
          deny:
            - pkg: io/ioutil
              desc: "Deprecated since Go 1.16"
            - pkg: golang.org/x/net/context
              desc: "Use context from stdlib"
            - pkg: github.com/golang/protobuf
              desc: "Deprecated, use google.golang.org/protobuf"
            - pkg: github.com/satori/go.uuid
              desc: "Unmaintained, use github.com/google/uuid"

        tests:
          # Same approach for tests (your internal packages are valid)
          list-mode: lax
          files:
            - $test
          allow:
            - $gostd
            - github.com/Jaro-c/Lynx
            - github.com/stretchr/testify

  exclusions:
    # Keep default exclusions enabled (recommended)
    presets:
      - std-error-handling
      - common-false-positives

    rules:
      # Relax heavy complexity checks on tests
      - path: _test\.go
        linters:
          - gocognit
          - cyclop
          - gocyclo
          - funlen

      # Allow controlled usage of math/rand where justified
      - linters:
          - gosec
        text: "G404"

      # Ignore unchecked Close() in well-known safe cases
      - linters:
          - errcheck
        text: "Close"

formatters:
  enable:
    - goimports
    - golines

issues:
  # Do not artificially limit reported issues
  max-issues-per-linter: 0
  max-same-issues: 0
