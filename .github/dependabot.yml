version: 2
updates:
  # Go dependencies (go.mod / go.sum)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "type:deps"
    commit-message:
      prefix: "build"
      include: "scope"

  # GitHub Actions (keeps workflow action SHAs/tags up to date)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "type:deps"
      - "type:ci"
    commit-message:
      prefix: "ci"
      include: "scope"
