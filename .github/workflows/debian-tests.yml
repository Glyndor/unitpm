name: Debian package tests

on:
  push:
    branches: [main]
    paths:
      - "debian/**"
      - ".github/workflows/debian-tests.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main]
    paths:
      - "debian/**"
      - ".github/workflows/debian-tests.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: debian-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install debhelper
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper build-essential

      - name: Build .deb
        # setup-go put the modern toolchain first on PATH, so debian/rules'
        # `go build` satisfies go.mod's 1.26 requirement even though the
        # runner's `golang-go` package is older. -d skips Build-Depends check.
        # CGO disabled so the binary has no glibc shlib deps — lets the same
        # .deb install cleanly across the matrix (ubuntu 22.04 → trixie).
        env:
          CGO_ENABLED: "0"
        run: |
          dpkg-buildpackage -us -uc -b -d
          mkdir -p debs
          cp ../lynxpm_*.deb debs/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lynxpm-deb
          path: debs/*.deb
          retention-days: 7

  lintian:
    name: Lintian
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lynxpm-deb
          path: debs

      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian

      - name: Run lintian
        run: lintian --fail-on error --info --display-info debs/*.deb

  install-matrix:
    name: Install (${{ matrix.image }})
    needs: build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm
          - debian:trixie
          - ubuntu:22.04
          - ubuntu:24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lynxpm-deb
          path: debs

      - name: Prepare container (block service start, no interactive prompts)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # policy-rc.d = 101 tells maintainer scripts "do not start services".
          # Containers lack systemd as PID 1 so any attempt would fail.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends \
            adduser ca-certificates systemd policykit-1 || \
          apt-get install -y --no-install-recommends \
            adduser ca-certificates systemd polkitd

      - name: Install lynxpm from .deb
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get install -y ./debs/*.deb

      - name: Smoke — CLI + filesystem layout
        run: |
          set -eux
          command -v lynxpm
          command -v lynxd
          lynxpm --version
          lynxpm --help >/dev/null
          [ -f /usr/lib/systemd/system/lynxd.service ] || [ -f /lib/systemd/system/lynxd.service ]
          getent passwd lynx
          getent group lynxadm
          [ -d /var/lib/lynx-pm ]
          [ -d /var/log/lynx-pm ]

      - name: Smoke — user-mode daemon + CLI lifecycle
        # Exercises start/list/show/logs/restart/stop/delete end-to-end against
        # a user-mode lynxd (no systemd, no root). Catches IPC / manager /
        # spec-parsing regressions that pure --version + install checks miss.
        run: |
          set -eux
          apt-get install -y --no-install-recommends procps util-linux

          # Unprivileged user for the user-mode daemon.
          id testuser 2>/dev/null || useradd -m -s /bin/sh testuser

          # Private XDG_RUNTIME_DIR the lynx socket helper will accept (0700).
          install -d -m 0700 -o testuser -g testuser /tmp/xdg-test

          # Run the whole lifecycle as testuser.
          runuser -u testuser -- sh -eu <<'SMOKE'
          export XDG_RUNTIME_DIR=/tmp/xdg-test
          export HOME=/home/testuser

          lynxd >/tmp/lynxd.log 2>&1 &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true' EXIT

          # Wait up to 5s for the socket to become responsive.
          for i in $(seq 1 50); do
            lynxpm list --json >/dev/null 2>&1 && break
            sleep 0.1
          done

          # Sanity: empty list after a fresh daemon.
          [ "$(lynxpm list --json)" = "[]" ]

          # start → list → show → stop → delete.
          lynxpm start "/bin/sleep 300" --name smoke-proc --restart never
          lynxpm list --json | grep -q smoke-proc
          lynxpm show smoke-proc >/dev/null
          lynxpm stop smoke-proc
          lynxpm delete smoke-proc
          [ "$(lynxpm list --json)" = "[]" ]
          SMOKE

      - name: Dump lynxd log on failure
        if: failure()
        run: cat /tmp/lynxd.log 2>/dev/null || true

      - name: Purge — leaves no files behind (sanity)
        run: |
          set -eux
          apt-get purge -y lynxpm
          # Binary and unit file must be gone after purge.
          ! command -v lynxpm
          ! command -v lynxd
          [ ! -f /usr/lib/systemd/system/lynxd.service ]
          [ ! -f /lib/systemd/system/lynxd.service ]

  piuparts:
    name: Piuparts (install/upgrade/purge)
    needs: build-deb
    runs-on: ubuntu-latest
    # piuparts is no longer packaged in Ubuntu 24.04's default archive, so
    # host the job inside a Debian container. The container must be privileged
    # for debootstrap's chroot/mount operations to succeed.
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lynxpm-deb
          path: debs

      - name: Install piuparts
        run: |
          apt-get update
          apt-get install -y --no-install-recommends piuparts debootstrap ca-certificates

      - name: Run piuparts
        # --no-diversions: we don't ship dpkg-divert calls.
        # -d trixie: bootstrap a stable Debian chroot for the install/purge cycle.
        # --warn-on-leftovers-after-purge → the job still fails on maintainer
        # script errors, but mere leftover /var files (logs, user data) warn only.
        run: |
          piuparts \
            --no-diversions \
            -d trixie \
            --mirror=http://deb.debian.org/debian \
            --warn-on-leftovers-after-purge \
            debs/*.deb

  autopkgtest:
    name: Autopkgtest (smoke)
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lynxpm-deb
          path: debs

      - name: Install autopkgtest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autopkgtest

      - name: Run autopkgtest
        # `-- null` runs the tests directly on the runner. Ephemeral VM, so
        # the lack of isolation from the SUT is acceptable here.
        run: |
          sudo autopkgtest debs/*.deb . -- null
