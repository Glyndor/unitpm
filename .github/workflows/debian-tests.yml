name: debian

on:
  push:
    branches: ["**"]
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      - "cmd/**"
      - ".github/workflows/debian-tests.yml"
  pull_request:
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      - "cmd/**"
      - ".github/workflows/debian-tests.yml"

permissions:
  contents: read

jobs:
  debian:
    uses: Glyndor/.github/.github/workflows/rust-debian.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
    with:
      package-name: unitpm
      # debian/rules builds for musl so the package carries no libc floor,
      # and Debian's toolchain ships no musl standard library. Keep this in
      # step with rust-ci's toolchain: the packaged binary must come from
      # the compiler CI validates with.
      rust-toolchain: "1.98"
      rust-target: x86_64-unknown-linux-musl
