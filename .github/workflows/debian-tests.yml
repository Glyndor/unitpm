name: debian

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    uses: Glyndor/.github/.github/workflows/rust-debian.yml@eb930630069c53c0119c89eb7929e2845efdb888 # v1.18.2
    with:
      package-name: unitpm
      # debian/rules builds for musl so the package carries no libc floor,
      # and Debian's toolchain ships no musl standard library. Keep this in
      # step with rust-ci's toolchain: the packaged binary must come from
      # the compiler CI validates with.
      rust-toolchain: "1.98"
      rust-target: x86_64-unknown-linux-musl
      # The updater speaks HTTPS, so ureq -> rustls -> ring is in the tree
      # and ring compiles C. Cross-compiling that to musl needs a musl C
      # toolchain, which the job's fixed tooling list does not carry. It
      # cannot go in Build-Depends either: dpkg-checkbuilddeps would then
      # fail for a package this job never installs.
      apt-packages: musl-tools
