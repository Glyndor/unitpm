name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write     # required for SLSA provenance signing
  attestations: write # required to upload attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w \
            -X 'github.com/Jaro-c/Lynx/internal/version.Version=${VERSION}' \
            -X 'github.com/Jaro-c/Lynx/internal/version.Commit=${COMMIT}' \
            -X 'github.com/Jaro-c/Lynx/internal/version.BuildDate=${BUILD_DATE}'"

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o lynx_linux_amd64 ./cmd/lynx
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o lynx_linux_arm64 ./cmd/lynx

      - name: Build Debian package
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper build-essential
          dpkg-buildpackage -us -uc -b -d
          cp ../lynx-pm_*.deb .

      - name: Sign binaries
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run scripts/sign.go lynx_linux_amd64
          go run scripts/sign.go lynx_linux_arm64

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            lynx_linux_amd64
            lynx_linux_arm64
            lynx-pm_*.deb

      - name: Extract release notes
        run: |
          # Extract notes for current version from debian/changelog
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION_NUM" '
            /^lynx-pm \(/ {
              if (found) exit
              if ($0 ~ "\\(" ver "-") { found=1; next }
            }
            found && /^ --/ { exit }
            found { print }
          ' debian/changelog > release_notes.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Lynx ${GITHUB_REF_NAME}" \
            --notes-file release_notes.txt \
            lynx_linux_amd64 \
            lynx_linux_amd64.sig \
            lynx_linux_arm64 \
            lynx_linux_arm64.sig \
            lynx-pm_*.deb
