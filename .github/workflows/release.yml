name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create release, upload assets
      id-token: write     # required for SLSA provenance signing
      attestations: write # required to upload attestations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w \
            -X 'github.com/Jaro-c/Lynx/internal/version.Version=${VERSION}' \
            -X 'github.com/Jaro-c/Lynx/internal/version.Commit=${COMMIT}' \
            -X 'github.com/Jaro-c/Lynx/internal/version.BuildDate=${BUILD_DATE}'"

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o lynxpm_linux_amd64 ./cmd/lynxpm
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o lynxpm_linux_arm64 ./cmd/lynxpm

      - name: Build Debian package
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper build-essential
          dpkg-buildpackage -us -uc -b -d
          cp ../lynxpm_*.deb .

      - name: Sign binaries
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
        run: |
          go run scripts/sign.go lynxpm_linux_amd64
          go run scripts/sign.go lynxpm_linux_arm64

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            lynxpm_linux_amd64
            lynxpm_linux_arm64
            lynxpm_*.deb

      - name: Generate SBOM (amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: lynxpm_linux_amd64
          format: spdx-json
          output-file: lynxpm_linux_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (arm64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: lynxpm_linux_arm64
          format: spdx-json
          output-file: lynxpm_linux_arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Extract release notes
        run: |
          # Extract notes for current version from debian/changelog
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION_NUM" '
            /^lynxpm \(/ {
              if (found) exit
              if ($0 ~ "\\(" ver "-") { found=1; next }
            }
            found && /^ --/ { exit }
            found { print }
          ' debian/changelog > release_notes.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Lynx ${GITHUB_REF_NAME}" \
            --notes-file release_notes.txt \
            lynxpm_linux_amd64 \
            lynxpm_linux_amd64.sig \
            lynxpm_linux_amd64.spdx.json \
            lynxpm_linux_arm64 \
            lynxpm_linux_arm64.sig \
            lynxpm_linux_arm64.spdx.json \
            lynxpm_*.deb
