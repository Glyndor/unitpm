name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create release, upload assets
      id-token: write     # required for SLSA provenance signing
      attestations: write # required to upload attestations
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w \
            -X 'github.com/Jaro-c/unitpm/internal/version.Version=${VERSION}' \
            -X 'github.com/Jaro-c/unitpm/internal/version.Commit=${COMMIT}' \
            -X 'github.com/Jaro-c/unitpm/internal/version.BuildDate=${BUILD_DATE}'"

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o unitpm_linux_amd64 ./cmd/unitpm
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o unitpm_linux_arm64 ./cmd/unitpm

      - name: Build Debian package
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper build-essential
          dpkg-buildpackage -us -uc -b -d
          cp ../unitpm_*.deb .

      - name: Sign binaries
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
        run: |
          go run scripts/sign.go unitpm_linux_amd64
          go run scripts/sign.go unitpm_linux_arm64

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            unitpm_linux_amd64
            unitpm_linux_arm64
            unitpm_*.deb

      # The SBOM step is deliberately absent, and this release will ship
      # without one until it comes back through the shared reusable.
      #
      # It used to be two `anchore/sbom-action` calls. That action is a
      # wrapper around a tool, which the CI standard no longer allows: an
      # `uses:` is for runner primitives, and everything else is a pinned
      # tool invoked from a line we wrote. It was also producing spdx-json
      # where the releases standard requires CycloneDX, and its pin comment
      # read `# v0` - a major alias rather than a real tag, so Dependabot
      # could move the SHA under a comment that never became visibly false.
      #
      # I am not replacing it with a Go generator, because the Go tree is
      # being removed by the rewrite and the replacement would be dead on
      # arrival. `rust-supply-chain.yml` already does exactly this job -
      # `cargo install --locked cargo-cyclonedx` at a pinned version, then
      # one line of our own - and this workflow adopts it along with the
      # rest of the shared CI once the rewrite lands.

      - name: Extract release notes
        run: |
          # Extract notes for current version from debian/changelog
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION_NUM" '
            /^unitpm \(/ {
              if (found) exit
              if ($0 ~ "\\(" ver "-") { found=1; next }
            }
            found && /^ --/ { exit }
            found { print }
          ' debian/changelog > release_notes.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "unitpm ${GITHUB_REF_NAME}" \
            --notes-file release_notes.txt \
            unitpm_linux_amd64 \
            unitpm_linux_amd64.sig \
            unitpm_linux_arm64 \
            unitpm_linux_arm64.sig \
            unitpm_*.deb
