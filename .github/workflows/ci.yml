name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
    with:
      # Measured, not chosen: `cargo llvm-cov` reports 74.68% of regions and
      # 75.50% of lines across the whole crate, with no exclusion regex. The
      # org standard asks for 90; setting that today would fail every build
      # and teach everyone to ignore the gate.
      #
      # 70 is a ratchet, not a target. It sits below the measured number on
      # purpose — a floor set exactly at today's coverage turns any unrelated
      # refactor that moves one region into a red build. Raise it when real
      # coverage rises; never lower it to make a red build green.
      coverage-threshold: 70
      # No extra-test-os. unitpm is Linux-only by design -- systemd units,
      # polkit, landlock and a Unix socket, with 58 `target_os = "linux"`
      # blocks and no stubs behind them. Testing on macOS and Windows spent CI
      # to fail on platforms README.md line 121 already says are unsupported.
      msrv: "1.96"

  line-limit:
    uses: Glyndor/.github/.github/workflows/line-limit.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1

  workflow-lint:
    uses: Glyndor/.github/.github/workflows/workflow-lint.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1

  shell-ci:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@8ae47ccd49ffdbf59d1acf7e6f9c18165bfba959 # v1.19.0

  # The four jobs below exist to satisfy the protect-main ruleset, which still
  # requires the status names the Go CI emitted: Lint, Test, Build (amd64) and
  # Build (arm64). Reusable workflows publish their checks as "<caller job> /
  # <reusable job>", so `rust / Test` can never satisfy a rule asking for
  # `Test`. They live here rather than in debian-tests.yml because that
  # workflow is path-filtered: a required check that does not run on every pull
  # request blocks the merge for ever on any PR that misses its paths.
  #
  # Lint and Test reflect the rust job. The two builds compile for real -- a
  # check that reports success without doing the work is worse than no check,
  # and nothing in CI verified the arm64 target before this, even though the
  # release publishes an arm64 binary.

  Lint:
    needs: [rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reflect the rust result
        env:
          RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          echo "rust = $RESULT"
          [ "$RESULT" = "success" ] || exit 1

  Test:
    needs: [rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reflect the rust result
        env:
          RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          echo "rust = $RESULT"
          [ "$RESULT" = "success" ] || exit 1

  Build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install the toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Same version debian/rules and rust-ci.yml build with, so the binary
          # this job proves compiles is the one the package ships.
          rustup toolchain install 1.98 --profile minimal --no-self-update
          rustup target add --toolchain 1.98 "$TARGET"

      - name: Install the musl cross toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # `ring` compiles C and assembly, so a musl target needs a real cross
          # compiler; the Rust std alone is not enough. musl-tools covers
          # x86_64, which is the host arch here.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          if [ "$TARGET" = "aarch64-unknown-linux-musl" ]; then
            # aarch64 goes through cross, which runs the build in an image
            # carrying a real aarch64 musl toolchain. cargo-zigbuild was the
            # first attempt and zig rejects the linker argument rustc passes
            # by default for this target:
            #   error: unsupported linker arg: --fix-cortex-a53-843419
            cargo install cross --locked --version 0.2.5
          fi

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "aarch64-unknown-linux-musl" ]; then
            cross +1.98 build --release --locked --all-features --target "$TARGET"
          else
            cargo +1.98 build --release --locked --all-features --target "$TARGET"
          fi
          # A build that produced no binary is not a build.
          test -x "target/$TARGET/release/unitpm"
          test -x "target/$TARGET/release/unitpmd"
          file "target/$TARGET/release/unitpm"

      - name: Type-check the tests for the same target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # debian/rules runs `cargo test` against this target too, so a test
          # that only compiles under glibc breaks the package build while the
          # binary build above stays green. Checking here reports it against
          # the job named for the architecture instead.
          if [ "$TARGET" = "aarch64-unknown-linux-musl" ]; then
            cross +1.98 check --release --locked --all-features --all-targets --target "$TARGET"
          else
            cargo +1.98 check --release --locked --all-features --all-targets --target "$TARGET"
          fi
