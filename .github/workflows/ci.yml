name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: Glyndor/.github/.github/workflows/rust-ci.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
    with:
      # Measured, not chosen: `cargo llvm-cov` reports 74.68% of regions and
      # 75.50% of lines across the whole crate, with no exclusion regex. The
      # org standard asks for 90; setting that today would fail every build
      # and teach everyone to ignore the gate.
      #
      # 70 is a ratchet, not a target. It sits below the measured number on
      # purpose — a floor set exactly at today's coverage turns any unrelated
      # refactor that moves one region into a red build. Raise it when real
      # coverage rises; never lower it to make a red build green.
      coverage-threshold: 70
      # No extra-test-os. unitpm is Linux-only by design -- systemd units,
      # polkit, landlock and a Unix socket, with 58 `target_os = "linux"`
      # blocks and no stubs behind them. Testing on macOS and Windows spent CI
      # to fail on platforms README.md line 121 already says are unsupported.
      msrv: "1.96"

  line-limit:
    uses: Glyndor/.github/.github/workflows/line-limit.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1

  workflow-lint:
    uses: Glyndor/.github/.github/workflows/workflow-lint.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1

  shell-ci:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
