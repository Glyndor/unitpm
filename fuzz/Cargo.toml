[package]
name = "unitpm-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.unitpm]
path = ".."

# Keep the fuzz crate out of the main workspace so a stable `cargo test` at the
# root never pulls in the nightly-only libfuzzer toolchain.
[workspace]

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "updater_parse"
path = "fuzz_targets/updater_parse.rs"
test = false
doc = false
bench = false
