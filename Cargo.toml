[package]
name = "unitpm"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
description = "Linux process manager — systemd-native PM2 alternative (Rust rewrite, phase 1)"
license = "MIT"
publish = false

# The org structure standard mandates all product code under internal/, so the
# Cargo src/ default is overridden with explicit path keys. Mirrors the layout
# Glyndor/klyradb established on its rewrite/rust-tauri branch.
[lib]
name = "unitpm"
path = "internal/lib.rs"

# Phase 7a: the two binaries. `unitpm` is the CLI; `unitpmd` is the IPC
# daemon. They live under `cmd/` to mirror the prior Go layout
# (`cmd/lynxpm/`, `cmd/lynxd/`) so the Debian package, systemd unit, and
# release scripts can target the same paths the previous tree used.
[[bin]]
name = "unitpm"
path = "cmd/unitpm/main.rs"

[[bin]]
name = "unitpmd"
path = "cmd/unitpmd/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v7"] }
libc = "0.2"
flate2 = "1"
ureq = { version = "2" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
regex = "1"

[dev-dependencies]
tempfile = "3"
